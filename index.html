<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form for Olympiad</title>
</head>
<body>
    <form method="post" enctype="multipart/form-data" action="https://formspree.io/f/mvgklewz">
        <label>Enter Name : </label>
        <input type="text" name="name">
        <br><br>
        <label>Choose Candidate's Image : </label>
        <input type="file" name="image" accept="image/*">
        <br><br>
        <label>Choose Gender : </label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Other
        <br><br>
        <label>Enter Age : </label>
        <input type="number" name="age" min="1" max="100">
        <br><br>
        <label>Choose Blood Group : </label>
        <input type="radio" name="blood_group">A+
        <input type="radio" name="blood_group">A-
        <input type="radio" name="blood_group">B+
        <input type="radio" name="blood_group">B-
        <input type="radio" name="blood_group">AB+
        <input type="radio" name="blood_group">AB-
        <input type="radio" name="blood_group">O+
        <input type="radio" name="blood_group">O-
        <br><br>

        <label>Enter Father's Name : </label>
        <input type="text" name="father_name">
        <br><br>
        <label>Enter Father's Phone Number : </label>
        <input type="text" name="father_phone">
        <br><br>
        <label>Enter Mother's Name : </label>
        <input type="text" name="mother_name">
        <br><br>
        <label>Enter Mother's Phone Number : </label>
        <input type="text" name="mother_phone">
        <br><br>
        <label>Select State or Union Territory : </label>
        <select name="state">
            <option value="" selected disabled hidden>Select an option</option>
            <option value="Andaman">Andaman and Nicobar Islands</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chandigarh">Chandigarh</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Dadra and Nagar Haveli">Dadra and Nagar Haveli</option>
            <option value="Daman and Diu">Daman and Diu</option>
            <option value="Delhi">Delhi</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jammu and Kashmir">Jammu and Kashmir</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Lakshadweep">Lakshadweep</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Puducherry">Puducherry</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>
        </select>
        <br><br>
        <label>Enter Address : </label><br>
        <textarea rows="5" and cols="50" name="address"></textarea>
        <br><br>
        <label>Enter Date of Birth : </label>
        <input type="date" name="dob">
        <br><br>
        <label>Select Class : </label>
        <select name="class">
            <option value="I">Class I</option>
            <option value="II">Class II</option>
            <option value="III">Class III</option>
            <option value="IV">Class IV</option>
            <option value="V">Class V</option>
            <option value="VI">Class VI</option>
            <option value="VII">Class VII</option>
            <option value="VIII">Class VIII</option>
            <option value="IX">Class IX</option>
            <option value="X">Class X</option>
            <option value="XI">Class XI</option>
            <option value="XII">Class XII</option>
        </select>
        <br><br>
        <label>Choose Subjects : </label>
        <input type="checkbox" name="subject" value="English">English
        <input type="checkbox" name="subject" value="Sanskrit">Sanskrit
        <input type="checkbox" name="subject" value="Bengali">Bengali
        <input type="checkbox" name="subject" value="Maths">Maths
        <input type="checkbox" name="subject" value="Science">Science
        <input type="checkbox" name="subject" value="Social Science">Social Science
        <input type="checkbox" name="subject" value="Computer">Computer
        <br><br>
        <label>Choose Hobbies : </label>
        <input type="checkbox" name="hobby" value="Reading">Reading
        <input type="checkbox" name="hobby" value="Writing">Writing
        <input type="checkbox" name="hobby" value="Singing">Singing
        <input type="checkbox" name="hobby" value="Dancing">Dancing
        <input type="checkbox" name="hobby" value="Playing">Playing
        <input type="checkbox" name="hobby" value="Cooking">Cooking
        <br><br>
        <label>Choose Sports : </label>
        <input type="checkbox" name="sports" value="Cricket">Cricket
        <input type="checkbox" name="sports" value="Football">Football
        <input type="checkbox" name="sports" value="Badminton">Badminton
        <input type="checkbox" name="sports" value="Hockey">Hockey
        <input type="checkbox" name="sports" value="Tennis">Tennis
        <input type="checkbox" name="sports" value="Kabaddi">Kabaddi
        <br><br>
        <label>Choose Language : </label>
        <input type="checkbox" name="language" value="English">English
        <input type="checkbox" name="language" value="Hindi">Hindi
        <input type="checkbox" name="language" value="Bengali">Bengali
        <br><br>
        <label>Choose Religion : </label>
        <input type="checkbox" name="religion" value="Hindu">Hindu
        <input type="checkbox" name="religion" value="Muslim">Muslim
        <input type="checkbox" name="religion" value="Christian">Christian
        <br><br>
        <input type="hidden" name="_redirect" value="https://raunak-45.github.io/form-test/thank-you.html">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <br><br>
    </form>
</body>
</html>
